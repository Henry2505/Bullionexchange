<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CBE Admin – Capital Applications</title>

  <!-- Redirect if not logged in -->
  <script>
    if (localStorage.getItem('isLoggedIn') !== 'true') {
      window.location.replace('admin-login.html?redirect=' + encodeURIComponent(window.location.pathname));
    }
  </script>

  <!-- Fonts & Core CSS -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <!-- DataTables + Buttons Extension CSS -->
  <link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/buttons/2.3.6/css/buttons.bootstrap5.min.css" rel="stylesheet">

  <style>
    /* THEME VARIABLES */
    :root {
      --bg: #000;
      --text: #fff;
      --gold: #ffd700;
      --glass-bg: rgba(255, 255, 255, 0.05);
      --overlay: rgba(0, 0, 0, 0.6);
    }
    [data-theme="light"] {
      --bg: #f5f5f5;
      --text: #333;
      --gold: #cca300;
      --glass-bg: rgba(0, 0, 0, 0.05);
      --overlay: rgba(255, 255, 255, 0.15);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Poppins',sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }
    a { color: var(--gold); text-decoration: none; }
    .overlay { position:fixed; top:0; left:0; width:100%; height:100%; background: var(--overlay); z-index:-1; }
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,215,0,0.2);
      transition: all .3s ease;
    }
    .glass:hover { transform: translateY(-4px); }

    /* HEADER */
    header.admin-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:1rem 2rem; background:rgba(0,0,0,0.6);
      border-bottom:1px solid var(--gold);
      position:sticky; top:0; z-index:10;
    }
    .logo { cursor:pointer; display:flex; align-items:center; }
    .logo img { height:40px; }
    #theme-toggle {
      background:none; border:none; font-size:1.25rem;
      cursor:pointer; color:var(--text);
    }

    /* PAGE CONTROLS */
    .controls {
      display:flex; flex-wrap:wrap; gap:1rem; align-items:center;
      margin-bottom:1rem; justify-content:space-between;
    }
    .dt-button { background: var(--gold) !important; border: none; color: #000 !important; font-weight:600; }
    .dt-button:hover { opacity:.85; }

    /* PAGE TITLE */
    #section-title {
      color: var(--gold);
      margin: 2rem 0 1rem;
      text-align: center;
    }

    /* TABLE PANEL */
    .table-panel {
      padding:2rem;
      margin-bottom:2rem;
      border-radius:8px;
      position: relative;
    }
    .dataTables_wrapper .dataTables_filter input {
      background: var(--bg); color: var(--text); border:1px solid var(--gold);
    }
    table.dataTable th, table.dataTable td {
      vertical-align: middle;
      transition: background .2s ease;
    }
    table.dataTable tbody tr:hover { background: rgba(255,215,0,0.1); cursor: pointer; }

    /* LOADING OVERLAY */
    #loading-overlay {
      position:absolute; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.7); display:flex; justify-content:center; align-items:center;
      z-index:5; display:none;
    }
    #loading-overlay .spinner-border { color: var(--gold); }

    /* Details Modal */
    .modal-header { background: var(--gold); color: #000; }
    .modal-body { color: var(--text); }

    /* Enhancements */
    .table .btn:hover {
      transform: scale(1.05);
      transition: transform 0.2s ease;
    }
    table.dataTable tbody tr.selected {
      background-color: var(--gold);
      color: #000;
    }
    @media (max-width: 576px) {
      .action-btn span {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <!-- Top Header -->
  <header class="admin-header glass">
    <div class="logo" id="logo">
      <img src="CBE_logo.PNG" alt="CBE Logo">
    </div>
    <button id="theme-toggle" aria-label="Toggle theme">🌞</button>
  </header>

  <!-- Main Content -->
  <main class="container">
    <h2 id="section-title">Capital Applications</h2>
    <!-- Controls -->
    <div class="controls d-flex flex-column flex-md-row justify-content-md-between align-items-md-center gap-2">
      <div>
        <button id="bulk-approve" class="btn btn-sm action-btn"><i class="bi bi-check-circle"></i><span> Approve Selected</span></button>
        <button id="bulk-delete" class="btn btn-sm action-btn"><i class="bi bi-trash"></i><span> Delete Selected</span></button>
        <span id="selected-count">0 selected</span>
      </div>
      <div>
        <select id="status-filter" class="form-select form-select-sm">
          <option value="">All Statuses</option>
          <option value="Pending">Pending</option>
          <option value="Approved">Approved</option>
        </select>
      </div>
      <div>
        <button id="export-csv" class="btn btn-sm action-btn"><i class="bi bi-file-earmark-arrow-down"></i><span> Export CSV</span></button>
        <button id="export-excel" class="btn btn-sm action-btn"><i class="bi bi-file-earmark-spreadsheet"></i><span> Export Excel</span></button>
      </div>
    </div>

    <div class="glass table-panel">
      <!-- Loading Overlay -->
      <div id="loading-overlay">
        <div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div>
      </div>

      <table id="applications-table" class="table table-hover table-borderless text-white" style="width:100%">
        <thead>
          <tr>
            <th><input type="checkbox" id="select-all"></th>
            <th>#</th>
            <th>Name</th>
            <th>Email</th>
            <th>WhatsApp</th>
            <th>Telegram</th>
            <th>Experience (yrs)</th>
            <th>Motivation</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <!-- Details Modal -->
  <div class="modal fade" id="appModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Application Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <dl class="row">
            <dt class="col-sm-3">Name</dt><dd class="col-sm-9" id="detail-name"></dd>
            <dt class="col-sm-3">Email</dt><dd class="col-sm-9" id="detail-email"></dd>
            <dt class="col-sm-3">WhatsApp</dt><dd class="col-sm-9" id="detail-whatsapp"></dd>
            <dt class="col-sm-3">Telegram</dt><dd class="col-sm-9" id="detail-telegram"></dd>
            <dt class="col-sm-3">Experience</dt><dd class="col-sm-9" id="detail-exp"></dd>
            <dt class="col-sm-3">Motivation</dt><dd class="col-sm-9" id="detail-motivation"></dd>
            <dt class="col-sm-3">Status</dt><dd class="col-sm-9" id="detail-status"></dd>
          </dl>
        </div>
      </div>
    </div>
  </div>

  <!-- Confirmation Modal -->
  <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Confirm Action</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p id="confirmMessage"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="confirmBtn">Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.3.6/js/dataTables.buttons.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.bootstrap5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.html5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Logo click → Dashboard
      document.getElementById('logo').onclick = () => window.location.href = 'admin-dashboard.html';

      // Theme toggle
      const themeBtn = document.getElementById('theme-toggle');
      const applyTheme = t => {
        document.documentElement.setAttribute('data-theme', t);
        localStorage.setItem('theme', t);
        themeBtn.textContent = t==='dark'?'🌞':'🌜';
      };
      themeBtn.onclick = () => applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
      applyTheme(localStorage.getItem('theme')||'dark');

      // Supabase init
      const supabase = window.supabase.createClient(
        'https://dapwpgvnfjcfqqhrpxla.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…EMsQ'
      );

      // Toast helper
      function showToast(msg, ok=true) {
        const t = document.createElement('div');
        t.className = `toast align-items-center text-white ${ok?'bg-success':'bg-danger'} border-0 position-fixed top-0 end-0 m-3`;
        t.innerHTML = `
          <div class="d-flex">
            <div class="toast-body">${msg}</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
          </div>`;
        document.body.append(t);
        new bootstrap.Toast(t,{delay:3000}).show();
      }

      // DataTable setup
      const table = $('#applications-table').DataTable({
        dom: 'Bfrtip',
        buttons: [],
        columns: [
          { data: null, orderable:false, render: () => '<input type="checkbox" class="row-select">' },
          { data: 'id' },
          { data: 'full_name' },
          { data: 'email' },
          { data: 'whatsapp', defaultContent:'—' },
          { data: 'telegram', defaultContent:'—' },
          { data: 'experience' },
          { data: 'motivation', render: txt => `<small>${txt}</small>` },
          { data: 'status' },
          { data: null, orderable:false, render: (_,__,row)=>
              `<button class="btn btn-sm btn-success me-1 action-btn" onclick="approveApplication(${row.id})" data-bs-toggle="tooltip" title="Approve this application" aria-label="Approve application"><i class="bi bi-check-circle"></i><span> Approve</span></button>
               <button class="btn btn-sm btn-outline-danger action-btn" onclick="deleteApplication(${row.id})" data-bs-toggle="tooltip" title="Delete this application" aria-label="Delete application"><i class="bi bi-trash"></i><span> Delete</span></button>
               <button class="btn btn-sm btn-outline-light ms-1 action-btn" onclick="showDetails(${row.id})" data-bs-toggle="tooltip" title="View details" aria-label="View application details"><i class="bi bi-eye"></i></button>
               <button class="btn btn-sm btn-outline-warning ms-1 action-btn" onclick="auctionApplication(${row.id})" data-bs-toggle="tooltip" title="Start auction for this application" aria-label="Start auction"><i class="bi bi-hammer"></i><span> Auction</span></button>`
          }
        ],
        order: [[1,'desc']],
        deferRender: true,
        scrollX: true,
        drawCallback: function() {
          const tooltipTriggerList = [].slice.call(document.querySelectorAll('#applications-table [data-bs-toggle="tooltip"]'));
          tooltipTriggerList.forEach(function (tooltipTriggerEl) {
            new bootstrap.Tooltip(tooltipTriggerEl);
          });
        }
      });

      // Loading overlay control
      const loadOverlay = $('#loading-overlay');
      function setLoading(on){ on?loadOverlay.show():loadOverlay.hide(); }

      // Load data
      async function loadCapitalApplications() {
        setLoading(true);
        try {
          let { data, error } = await supabase
            .from('capital_applications')
            .select('*')
            .order('created_at',{ascending:false});
          if (error) throw error;
          table.clear().rows.add(data).draw();
          setLoading(false);
        } catch (err) {
          console.error(err);
          showToast('Error loading applications',false);
          setLoading(false);
        }
      }

      // Single approve
      window.approveApplication = async id => {
        const btn = event.target;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Approving...';
        try {
          let { error } = await supabase
            .from('capital_applications')
            .update({ status:'Approved' })
            .eq('id', id);
          if (error) throw error;
          showToast('Approved successfully');
          loadCapitalApplications();
        } catch {
          showToast('Error approving',false);
        } finally {
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-check-circle"></i><span> Approve</span>';
        }
      };

      // Single delete
      window.deleteApplication = id => {
        const modal = new bootstrap.Modal(document.getElementById('confirmModal'));
        document.getElementById('confirmMessage').textContent = 'Are you sure you want to delete this application?';
        document.getElementById('confirmBtn').onclick = async () => {
          const confirmBtn = document.getElementById('confirmBtn');
          confirmBtn.disabled = true;
          confirmBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Deleting...';
          try {
            await supabase.from('capital_applications').delete().eq('id',id);
            showToast('Deleted successfully');
            loadCapitalApplications();
          } catch {
            showToast('Error deleting',false);
          } finally {
            confirmBtn.disabled = false;
            confirmBtn.innerHTML = 'Confirm';
            modal.hide();
          }
        };
        modal.show();
      };

      // Single auction
      window.auctionApplication = id => {
        const modal = new bootstrap.Modal(document.getElementById('confirmModal'));
        document.getElementById('confirmMessage').textContent = 'Are you sure you want to start an auction for this application?';
        document.getElementById('confirmBtn').onclick = async () => {
          const confirmBtn = document.getElementById('confirmBtn');
          confirmBtn.disabled = true;
          confirmBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Starting Auction...';
          try {
            let { error } = await supabase
              .from('capital_applications')
              .update({ status: 'In Auction' })
              .eq('id', id);
            if (error) throw error;
            showToast('Auction started successfully');
            loadCapitalApplications();
          } catch {
            showToast('Error starting auction', false);
          } finally {
            confirmBtn.disabled = false;
            confirmBtn.innerHTML = 'Confirm';
            modal.hide();
          }
        };
        modal.show();
      };

      // Bulk actions
      function getSelectedIds() {
        return $('#applications-table tbody input.row-select:checked')
          .closest('tr').map((_,tr)=>table.row(tr).data().id).get();
      }
      function updateSelectedCount() {
        const count = $('input.row-select:checked').length;
        $('#selected-count').text(`${count} selected`);
      }
      $('#select-all').on('change', function(){
        const checked = this.checked;
        $('input.row-select').prop('checked', checked).closest('tr').toggleClass('selected', checked);
        updateSelectedCount();
      });
      $('#applications-table').on('change', 'input.row-select', function(){
        $(this).closest('tr').toggleClass('selected', this.checked);
        updateSelectedCount();
      });
      $('#bulk-approve').on('click', async () => {
        const ids = getSelectedIds();
        if (!ids.length || !confirm(`Approve ${ids.length} selected?`)) return;
        await supabase.from('capital_applications').update({status:'Approved'}).in('id',ids);
        showToast('Bulk approved');
        loadCapitalApplications();
      });
      $('#bulk-delete').on('click', () => {
        const ids = getSelectedIds();
        if (!ids.length) return;
        const modal = new bootstrap.Modal(document.getElementById('confirmModal'));
        document.getElementById('confirmMessage').textContent = `Are you sure you want to delete ${ids.length} selected applications?`;
        document.getElementById('confirmBtn').onclick = async () => {
          const confirmBtn = document.getElementById('confirmBtn');
          confirmBtn.disabled = true;
          confirmBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Deleting...';
          try {
            await supabase.from('capital_applications').delete().in('id',ids);
            showToast('Bulk deleted');
            loadCapitalApplications();
          } catch {
            showToast('Error deleting',false);
          } finally {
            confirmBtn.disabled = false;
            confirmBtn.innerHTML = 'Confirm';
            modal.hide();
          }
        };
        modal.show();
      });

      // Export
      $('#export-csv').on('click', () => table.button().add( null, {
        extend: 'csvHtml5', title: 'CBE_Applications'
      }).trigger() );
      $('#export-excel').on('click', () => table.button().add( null, {
        extend: 'excelHtml5', title: 'CBE_Applications'
      }).trigger() );

      // Status filter
      $('#status-filter').on('change', function(){
        table.column(8).search(this.value).draw();
      });

      // Details modal
      window.showDetails = async id => {
        const { data, error } = await supabase
          .from('capital_applications')
          .select('*').eq('id',id).single();
        if (error) return showToast('Error fetching details',false);
        $('#detail-name').text(data.full_name);
        $('#detail-email').text(data.email);
        $('#detail-whatsapp').text(data.whatsapp||'—');
        $('#detail-telegram').text(data.telegram||'—');
        $('#detail-exp').text(data.experience);
        $('#detail-motivation').text(data.motivation);
        $('#detail-status').text(data.status);
        new bootstrap.Modal(document.getElementById('appModal')).show();
      };

      // Keyboard shortcuts
      document.addEventListener('keydown', e => {
        if (e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA') return;
        if (e.key==='A') $('#bulk-approve').click();
        if (e.key==='D') $('#bulk-delete').click();
        if (e.key==='E') $('#export-csv').click();
      });

      // Initial load
      loadCapitalApplications();
    });
  </script>
</body>
</html>
