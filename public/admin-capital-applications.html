<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CBE Admin – Capital Applications</title>
  <script>
    // Redirect to login if not authenticated
    if (localStorage.getItem('isLoggedIn') !== 'true') {
      window.location.replace('admin-login.html?redirect=' + encodeURIComponent(window.location.pathname));
    }
  </script>
  <!-- CSS Dependencies -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/responsive/2.2.9/css/responsive.dataTables.min.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/buttons/2.2.3/css/buttons.dataTables.min.css" rel="stylesheet">
  <style>
    /* (all your dark/light theme CSS remains exactly the same) */
  </style>
</head>
<body>
  <div class="overlay"></div>

  <!-- Top Header -->
  <header class="admin-header glass">
    <div class="logo" id="logo"><img src="CBE_logo.PNG" alt="CBE Logo"></div>
    <button id="theme-toggle" aria-label="Toggle theme">🌞</button>
  </header>

  <!-- Main Content -->
  <main class="container">
    <h2 id="section-title">Capital Applications</h2>
    <div class="glass table-panel">
      <!-- Bulk Actions and Filters -->
      <div class="row mb-3">
        <div class="col-12 col-md-6 d-flex justify-content-start flex-wrap">
          <button id="bulk-approve" class="btn btn-success me-2 mb-2">
            <i class="bi bi-check-circle"></i> Approve Selected
          </button>
          <button id="bulk-delete" class="btn btn-danger me-2 mb-2">
            <i class="bi bi-trash"></i> Delete Selected
          </button>
        </div>
        <div class="col-12 col-md-6 d-flex justify-content-end">
          <select id="status-filter" class="form-select w-auto">
            <option value="">All Statuses</option>
            <option value="Pending">Pending</option>
            <option value="Approved">Approved</option>
            <option value="Auctioned">Auctioned</option>
          </select>
        </div>
      </div>

      <!-- Loading Spinner -->
      <div id="loading" class="text-center" style="display: none;">
        <div class="spinner-border text-gold" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <!-- DataTable -->
      <table id="applications-table" class="table table-hover table-borderless text-white" style="width:100%">
        <thead>
          <tr>
            <th><input type="checkbox" id="select-all"></th>
            <th>#</th>
            <th>Name</th>
            <th>Email</th>
            <th>WhatsApp</th>
            <th>Telegram</th>
            <th>Experience (yrs)</th>
            <th>Motivation</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <!-- Application Details Modal -->
  <div class="modal fade" id="applicationModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content glass">
        <div class="modal-header">
          <h5 class="modal-title">Application Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body"><!-- filled dynamically --></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- JS Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.datatables.net/responsive/2.2.9/js/dataTables.responsive.min.js"></script>
  <script src="https://cdn.datatables.net/responsive/2.2.9/js/responsive.bootstrap5.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.2.3/js/dataTables.buttons.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.2.3/js/buttons.html5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Logo and Theme
      document.getElementById('logo').onclick = () => window.location.href = 'admin-dashboard.html';
      const themeBtn = document.getElementById('theme-toggle');
      const applyTheme = th => {
        document.documentElement.setAttribute('data-bs-theme', th);
        localStorage.setItem('theme', th);
        themeBtn.textContent = th === 'dark' ? '🌞' : '🌜';
      };
      themeBtn.onclick = () => applyTheme(document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark');
      applyTheme(localStorage.getItem('theme') || 'dark');

      // Supabase client
      const supabase = window.supabase.createClient(
        'https://dapwpgvnfjcfqqhrpxla.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      );

      // Toast helper
      function showToast(msg, ok = true) {
        const toast = document.createElement('div');
        toast.className = `toast align-items-center text-white ${ok ? 'bg-success' : 'bg-danger'} border-0 position-fixed top-0 end-0 m-3`;
        toast.innerHTML = `
          <div class="d-flex">
            <div class="toast-body">${msg}</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
          </div>`;
        document.body.appendChild(toast);
        new bootstrap.Toast(toast, { delay: 3000 }).show();
      }

      // Build the DataTable
      const table = $('#applications-table').DataTable({
        dom: 'Bfrtip',
        buttons: ['copy','csv','excel','pdf','print'],
        responsive: true,
        columns: [
          {
            data: null,
            orderable: false,
            render: (_,__,row) =>
              `<input type="checkbox" class="row-select" data-id="${row.id}">`
          },
          { data: 'id' },
          { data: 'full_name' },
          { data: 'email' },
          { data: 'whatsapp', defaultContent: '—' },
          { data: 'telegram', defaultContent: '—' },
          { data: 'experience' },
          { data: 'motivation', render: txt => `<small>${txt}</small>` },
          { data: 'status' }
        ],
        order: [[1,'desc']]
      });

      // Load data
      async function loadApplications() {
        $('#loading').show();
        try {
          const { data, error } = await supabase
            .from('capital_applications')
            .select('*')
            .order('created_at',{ascending:false});
          if (error) throw error;
          table.clear().rows.add(data).draw();
        } catch (e) {
          console.error(e);
          showToast('Error loading applications', false);
        } finally {
          $('#loading').hide();
        }
      }

      // Per-row actions
      window.viewApplication = id => {
        const row = table.rows().data().toArray().find(r=>r.id===id);
        if (!row) return showToast('Not found', false);
        document.querySelector('#applicationModal .modal-body').innerHTML = `
          <p><strong>Name:</strong> ${row.full_name}</p>
          <p><strong>Email:</strong> ${row.email}</p>
          <p><strong>WhatsApp:</strong> ${row.whatsapp||'—'}</p>
          <p><strong>Telegram:</strong> ${row.telegram||'—'}</p>
          <p><strong>Experience:</strong> ${row.experience} yrs</p>
          <p><strong>Motivation:</strong> ${row.motivation}</p>
          <p><strong>Status:</strong> ${row.status}</p>`;
        new bootstrap.Modal('#applicationModal').show();
      };

      async function updateStatus(ids, status, confirmMsg) {
        if (status==='Deleted' && !confirm(confirmMsg)) return;
        try {
          const op = status==='Deleted'
            ? supabase.from('capital_applications').delete().in('id',ids)
            : supabase.from('capital_applications').update({status}).in('id',ids);
          const { error } = await op;
          if (error) throw error;
          showToast(
            status==='Deleted'
            ? 'Application(s) deleted'
            : `Application(s) marked ${status.toLowerCase()}`
          );
          loadApplications();
        } catch(e) {
          console.error(e);
          showToast(`Error updating`, false);
        }
      }

      window.approveApplication = id => updateStatus([id],'Approved');
      window.deleteApplication  = id => {
        if (confirm('Are you sure you want to delete this application?'))
          updateStatus([id],'Deleted','');
      };
      window.auctionApplication = id => {
        if (confirm('Mark this application for auction?'))
          updateStatus([id],'Auctioned');
      };

      // Bulk actions helper
      function getSelectedIds() {
        return Array.from(document.querySelectorAll('.row-select:checked'))
          .map(cb => parseInt(cb.dataset.id,10));
      }

      document.getElementById('bulk-approve').onclick = () => {
        const ids = getSelectedIds();
        if (!ids.length) return showToast('No applications selected', false);
        updateStatus(ids,'Approved');
      };
      document.getElementById('bulk-delete').onclick = () => {
        const ids = getSelectedIds();
        if (!ids.length) return showToast('No applications selected', false);
        if (confirm('Delete selected applications?'))
          updateStatus(ids,'Deleted');
      };

      // Status filter
      document.getElementById('status-filter').onchange = function(){
        table.column(8).search(this.value).draw();
      };

      // Select‐all checkbox
      document.getElementById('select-all').addEventListener('change', function(){
        const checked = this.checked;
        document.querySelectorAll('.row-select').forEach(cb=> cb.checked=checked);
      });

      // Un‐check “select all” if any row is unchecked
      $('#applications-table tbody').on('change','.row-select', function(){
        if (!this.checked) document.getElementById('select-all').checked = false;
      });

      // Initial load
      loadApplications();
    });
  </script>
</body>
</html>
